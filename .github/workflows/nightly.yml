name: Nightly

on:
  push:
    branches: [nightly]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  CHANNEL: nightly
  VERSION: 1.0.0-nightly.${{ github.run_number }}
  FILE_VERSION: 1.0.0.${{ github.run_number }}
  GOOGLE_CLIENT_JSON: ${{ secrets.GOOGLE_CLIENT_JSON }}
  GH_TOKEN: ${{ github.token }}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Write OAuth client
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:GOOGLE_CLIENT_JSON)) {
            throw 'GOOGLE_CLIENT_JSON repository secret is missing.'
          }
          Set-Content -Path google-client.json -Value $env:GOOGLE_CLIENT_JSON -Encoding UTF8

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Download yt-dlp
        shell: pwsh
        run: |
          New-Item -ItemType Directory tools -Force | Out-Null
          Invoke-WebRequest 'https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe' `
            -OutFile 'tools\yt-dlp.exe' -UseBasicParsing

      - name: Resolve release notes
        shell: pwsh
        run: |
          $notes = (git log -1 --pretty=%s).Trim()
          if ([string]::IsNullOrWhiteSpace($notes)) { $notes = "Nightly build $env:VERSION" }
          "RELEASE_NOTES=$notes" >> $env:GITHUB_ENV

      - name: Build nightly packages
        shell: pwsh
        run: |
          .\tools\build-channel.ps1 -Channel nightly -Version $env:VERSION `
            -FileVersion $env:FILE_VERSION -ReleaseNotes $env:RELEASE_NOTES

      - name: Build manifest
        shell: pwsh
        run: |
          $release = Get-Content 'dist\release-nightly.json' -Raw | ConvertFrom-Json
          $setup = Get-Item -LiteralPath $release.setup.path
          $portable = Get-Item -LiteralPath $release.portable.path
          $base = "https://github.com/${{ github.repository }}/releases/download/nightly"
          New-Item -ItemType Directory 'public' -Force | Out-Null
          foreach ($name in @('stable.json', 'nightly.json')) {
            try {
              Invoke-WebRequest "https://kabouls.github.io/YOMU-Player/$name" `
                -OutFile "public\$name" -UseBasicParsing
            } catch { }
          }
          # GitHub Pages has had trouble publishing stable.json for this project.
          # The stable release carries the same manifest as an asset, so use that as the reliable source.
          try {
            Invoke-WebRequest 'https://github.com/kabouls/YOMU-Player/releases/latest/download/stable.json' `
              -OutFile 'public\stable.json' -UseBasicParsing
          } catch { }
          $manifest = [ordered]@{
            channel = 'nightly'
            version = $env:VERSION
            published = [DateTimeOffset]::UtcNow.ToString('o')
            notes = @($env:RELEASE_NOTES)
            setup = @{
              url = "$base/$($setup.Name)"
              sha256 = $release.setup.sha256
            }
            portable = @{
              url = "$base/$($portable.Name)"
              sha256 = $release.portable.sha256
            }
          }
          $manifest | ConvertTo-Json -Depth 6 | Set-Content 'public\nightly.json' -Encoding UTF8

      - name: Upload nightly release
        shell: pwsh
        run: |
          $release = Get-Content 'dist\release-nightly.json' -Raw | ConvertFrom-Json
          $setup = (Get-Item -LiteralPath $release.setup.path).FullName
          $portable = (Get-Item -LiteralPath $release.portable.path).FullName
          $title = "YOMU Player Nightly $env:VERSION"
          $exists = $false
          gh release view nightly --repo ${{ github.repository }} *> $null
          if ($LASTEXITCODE -eq 0) {
            $exists = $true
            gh release edit nightly --repo ${{ github.repository }} --title $title --notes $env:RELEASE_NOTES --prerelease
          }
          if (-not $exists) {
            gh release create nightly --repo ${{ github.repository }} --target $env:GITHUB_SHA `
              --title $title --notes $env:RELEASE_NOTES --prerelease
          }
          gh release upload nightly $setup $portable --repo ${{ github.repository }} --clobber

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: nightly-packages
          path: |
            dist/YOMU-Player-Nightly-Setup-*.exe
            dist/YOMU-Player-Nightly-Portable-*.zip
            dist/release-nightly.json

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: yomu-pages-nightly
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: yomu-pages-nightly
